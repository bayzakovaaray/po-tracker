<title>Портфель проектов ПО</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: рабочий стол менеджера ПО — шапка со сводкой, вкладки, канбан по этапам Регламента, боковая карточка проекта */
:root{
  --bg:#f6f5ee; --surface:#ffffff; --surface-2:#eeece2; --line:#dfdccf; --line-2:#ccc7b5;
  --fg:#24221b; --muted:#6a6555; --accent:#2e7d3a; --accent-soft:#dcefdc; --accent-fg:#ffffff;
  --gold:#c49a06; --ok:#2e7d3a; --ok-soft:#dcefdc; --warn:#a67c00; --warn-soft:#fbf0c2; --bad:#8a4b22; --bad-soft:#f1e2d5;
  --shadow:0 1px 2px rgba(36,34,27,.06),0 4px 14px rgba(36,34,27,.06);
  --green:#2e7d3a; --yellow:#f2c230; --brown:#7a4a26; --on-green:#ffffff; --on-yellow:#2b2307; --on-brown:#fff6ea;
  --green-soft:#d7ecd8; --yellow-soft:#fbefc0; --brown-soft:#eedfd0;
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121310; --surface:#1a1c16; --surface-2:#22251d; --line:#30332a; --line-2:#3f4337;
  --fg:#ecebe2; --muted:#a29f8e; --accent:#6cbf72; --accent-soft:#1f3522; --accent-fg:#0d1a0f;
  --gold:#e3c03a; --ok:#6cbf72; --ok-soft:#1f3522; --warn:#e3c03a; --warn-soft:#3a3214; --bad:#c98b5d; --bad-soft:#3a271b;
  --green:#3d9548; --yellow:#e6bb2c; --brown:#94603a; --green-soft:#1f3522; --yellow-soft:#3a3214; --brown-soft:#3a271b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121310; --surface:#1a1c16; --surface-2:#22251d; --line:#30332a; --line-2:#3f4337;
  --fg:#ecebe2; --muted:#a29f8e; --accent:#6cbf72; --accent-soft:#1f3522; --accent-fg:#0d1a0f;
  --gold:#e3c03a; --ok:#6cbf72; --ok-soft:#1f3522; --warn:#e3c03a; --warn-soft:#3a3214; --bad:#c98b5d; --bad-soft:#3a271b;
  --green:#3d9548; --yellow:#e6bb2c; --brown:#94603a; --green-soft:#1f3522; --yellow-soft:#3a3214; --brown-soft:#3a271b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.mark{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none}
.brand h1{font-size:24px;font-weight:800}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface-2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--ok)} .sync[data-s="saving"] i{background:var(--warn)} .sync[data-s="err"] i{background:var(--bad)}

/* summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;font-weight:500}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.inp,select.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
.filters .grow{flex:1 1 200px}

/* board */
.board-scroll{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:10px;min-height:300px}
.col{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;flex-direction:column;gap:2px;padding:2px 2px 6px}
.col-h h3{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.col-h h3 .num{color:var(--muted);font-weight:500}
.col-h small{color:var(--muted);font-size:11.5px;line-height:1.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.dim{opacity:.62}
.card .t{font-weight:600;line-height:1.3}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.light{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--line-2)}
.light.ok{background:var(--ok)} .light.warn{background:var(--warn)} .light.bad{background:var(--bad)}
.prog{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.prow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.prow .prog{flex:1}
.prio-high{color:var(--bad)} .prio-mid{color:var(--warn)} .prio-low{color:var(--muted)}
.col-empty{font-size:12px;color:var(--muted);padding:10px 4px;text-align:center}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.proj td{font-weight:600;background:var(--accent-soft)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* control */
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h2 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .light{margin-top:5px}
.item .w{min-width:0}
.item .w b{font-weight:600;display:block}
.item .w span{font-size:12px;color:var(--muted)}
.item .d{font-family:var(--f-mono);font-size:12px;white-space:nowrap;text-align:right}
.none{color:var(--muted);font-size:13px;padding:6px 0}
.cal{display:flex;flex-direction:column;gap:0}
.cal .ev{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cal .ev:first-child{border-top:0}
.cal .ev .dt{font-family:var(--f-mono);font-size:12.5px}
.cal .ev .dt small{display:block;color:var(--muted)}
.cal .ev .x b{display:block;font-weight:600}
.cal .ev .x span{font-size:12px;color:var(--muted)}

/* reports */
.rep-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rep-head{display:flex;flex-direction:column;gap:2px}
.rep-head h2{font-size:17px}
.note{font-size:12.5px;color:var(--muted)}

/* roadmap */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:20px;height:9px;border-radius:3px}
.lg.ms{width:9px;height:9px;transform:rotate(45deg);border-radius:1px;background:var(--gold)}
.lg.reg{width:0;height:12px;border-left:1.5px dashed var(--gold);border-radius:0}
.lg.today{width:0;height:12px;border-left:2px solid var(--bad);border-radius:0}
.rm-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.rm{position:relative}
.rm-body{position:relative}
.rm-row{display:flex;min-height:36px;border-bottom:1px solid var(--line)}
.rm-label{position:sticky;left:0;z-index:4;width:var(--lw);flex:none;background:var(--surface);padding:6px 10px;display:flex;gap:8px;align-items:center;border-right:1px solid var(--line);min-width:0}
.rm-label .w{min-width:0;display:flex;flex-direction:column}
.rm-label b{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rm-label .w>span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-track{position:relative;flex:none}
.rm-head{min-height:42px}
.rm-head .rm-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
.rm-head .rm-track{background:var(--surface-2)}
.rm-m{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);border-left:1px solid var(--line);font-family:var(--f-mono);white-space:nowrap}
.rm-m.y{color:var(--fg);font-weight:500}
.rm-flag{position:absolute;bottom:0;transform:translateX(-50%);color:var(--gold);font-size:10px;line-height:1}
.rm-grp{min-height:30px}
.rm-grp .rm-label{background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:13px;gap:6px}
.rm-grp .rm-track{background:var(--surface-2)}
.rm-p,.rm-a{cursor:pointer}
.rm-p:hover .rm-label,.rm-a:hover .rm-label{background:var(--surface-2)}
.rm-a{min-height:26px;border-bottom-style:dotted}
.rm-a .rm-label{padding-left:30px;padding-block:3px}
.rm-a .an{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm-bar{position:absolute;top:50%;transform:translateY(-50%);z-index:2;overflow:hidden;display:flex;align-items:center}
.rm-p .rm-bar{height:20px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid var(--c)}
.rm-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.5}
.rm-bar em{position:relative;font-style:normal;font-size:11px;font-family:var(--f-mono);padding:0 6px;color:var(--fg);margin-left:auto}
.rm-bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;border-left-style:dashed}
.rm-bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:dashed}
.p-ok{--c:var(--accent)} .p-warn{--c:var(--warn)} .p-bad{--c:var(--bad)} .p-idle{--c:var(--muted)}
.rm-a .rm-bar{height:10px;border-radius:3px}
.a-done{background:color-mix(in srgb,var(--ok) 60%,var(--surface))}
.a-doing{background:var(--accent)}
.a-todo{background:transparent;border:1.5px solid var(--accent)}
.a-over{background:var(--bad)}
.rm-ms{position:absolute;top:50%;width:10px;height:10px;transform:translate(-50%,-50%) rotate(45deg);z-index:3;background:var(--gold);border:1.5px solid var(--surface);border-radius:1px}
.rm-ms.bad{background:var(--bad)} .rm-ms.nodate{background:var(--muted)}
.rm-vl{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);z-index:1;pointer-events:none;opacity:.7}
.rm-reg{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--gold);z-index:1;pointer-events:none;opacity:.75}
.rm-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);z-index:3;pointer-events:none}
.rm-today span{position:absolute;top:3px;left:4px;font-size:10.5px;color:var(--bad);font-family:var(--f-mono);background:var(--surface);padding:0 4px;border-radius:3px;white-space:nowrap}

/* empty */
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.empty h2{font-size:18px}
.empty p{margin:0;color:var(--muted);max-width:56ch}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.38);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--bg);z-index:31;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{padding:16px 18px 0;display:flex;flex-direction:column;gap:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.d-top{display:flex;gap:10px;align-items:flex-start}
.d-top .nm{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:18px;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent;width:100%}
.d-top .nm:hover,.d-top .nm:focus{border-color:var(--line-2);background:var(--bg)}
.d-sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);padding:0 6px}
.stages{display:flex;gap:3px;overflow-x:auto;padding:0 6px 2px}
.st{flex:1 0 auto;border:0;background:var(--surface-2);font-size:11.5px;padding:5px 8px;border-radius:5px;color:var(--muted);white-space:nowrap}
.st.done{background:var(--accent-soft);color:var(--accent)}
.st.cur{background:var(--accent);color:var(--accent-fg);font-weight:600}
.dtabs{display:flex;gap:2px;overflow-x:auto}
.dtabs .tab{padding:9px 11px;font-size:13px}
.d-body{flex:1;overflow-y:auto;padding:18px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .label{font-size:12px;color:var(--muted);font-weight:500}
.fld .hint{font-size:11.5px;color:var(--muted)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.4}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.section-t{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px;flex-wrap:wrap}
.section-t h3{font-size:15px}
.etbl input,.etbl select,.etbl textarea{border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 6px;width:100%;min-width:0}
.etbl input:hover,.etbl select:hover,.etbl textarea:hover{border-color:var(--line)}
.etbl input:focus,.etbl select:focus,.etbl textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
.etbl td{padding:4px 4px;vertical-align:middle}
.etbl textarea{min-height:34px;resize:vertical}
.etbl tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:4px 6px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.score{font-family:var(--f-mono);font-weight:500;padding:2px 8px;border-radius:5px;display:inline-block;min-width:34px;text-align:center}
.feed{display:flex;flex-direction:column;gap:10px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.entry .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.entry p{margin:0;white-space:pre-wrap}
.addbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.addbox .full{grid-column:1/-1}
.addbox .wide{grid-column:span 2}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:var(--r);padding:10px 12px;color:var(--bad);font-size:13px}
.ro-note{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:8px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:50;font-size:13px;box-shadow:var(--shadow)}
a{color:var(--accent)}
@media (max-width:640px){
  .form{grid-template-columns:1fr}
  .addbox{grid-template-columns:1fr 1fr}
  .addbox .wide{grid-column:1/-1}
  .brand h1{font-size:20px}
  .d-body{padding:14px}
  .ctrl{grid-template-columns:1fr}
}

async function api(path, opts = {}) {
  const r = await fetch(path, {credentials: "same-origin", cache: "no-store", ...opts,
    headers: opts.body ? {"Content-Type": "application/json"} : {}});
  const fail = code => { const e = new Error(code); e.code = code; e.status = r.status; throw e; };
  if (r.status === 401) fail("unauthenticated");
  if (r.status === 403) fail("invalid_argument");
  if (r.status === 413) fail("quota_exceeded");
  if (r.status === 429) fail("too_many");
  if (!r.ok) fail("http_" + r.status);
  return r.status === 204 ? null : r.json();
}

/* Сервер со входом по коду. Два варианта с одинаковым интерфейсом:
   vercelBackend — свои функции /api на том же домене (сессия в cookie);
   neonBackend   — Neon Data API, функции public.po_* (сессия в localStorage). */
const vercelBackend = {
  login: (name, code) => api("/api/login", {method: "POST", body: JSON.stringify({name, code})}),
  me: () => api("/api/me"),
  logout: () => api("/api/me?logout=1", {method: "POST"}),
  list: since => api("/api/projects" + (since !== null ? "?since=" + since : "")),
  put: (id, body) => api("/api/projects?id=" + encodeURIComponent(id), {method: "PUT", body: JSON.stringify(body)}),
  remove: id => api("/api/projects?id=" + encodeURIComponent(id), {method: "DELETE"})
};

const NEON_ERR = {auth: "unauthenticated", code: "unauthenticated", read_only: "invalid_argument", too_large: "quota_exceeded", too_many: "too_many"};
function neonBackend(cfg) {
  const TK = "po-token";
  const tok = () => { try { return localStorage.getItem(TK) || ""; } catch (e) { return ""; } };
  async function rpc(fn, args) {
    const headers = {"Content-Type": "application/json"};
    if (cfg.jwt) headers.Authorization = "Bearer " + cfg.jwt;
    let r;
    try { r = await fetch(cfg.api.replace(/\/$/, "") + "/rpc/" + fn, {method: "POST", headers, body: JSON.stringify(args), cache: "no-store"}); }
    catch (e) { const x = new Error("network"); x.code = "network"; throw x; }
    if (!r.ok) { const x = new Error("http_" + r.status); x.code = "http_" + r.status; x.status = r.status >= 500 ? 503 : r.status; throw x; }
    const d = await r.json();
    if (d && d.error) { const x = new Error(d.error); x.code = NEON_ERR[d.error] || d.error; throw x; }
    return d;
  }
  return {
    async login(name, code) {
      const d = await rpc("po_login", {code, name});
      try { localStorage.setItem(TK, d.token); } catch (e) {}
      return {role: d.role, name: d.name};
    },
    me() { if (!tok()) { const x = new Error("auth"); x.code = "unauthenticated"; return Promise.reject(x); } return rpc("po_me", {tok: tok()}); },
    async logout() { const t = tok(); try { localStorage.removeItem(TK); } catch (e) {} if (t) await rpc("po_logout", {tok: t}); },
    list: since => rpc("po_list", {tok: tok(), since}),
    put: (id, body) => rpc("po_put", {tok: tok(), pid: id, pdata: body}),
    remove: id => rpc("po_delete", {tok: tok(), pid: id})
  };
}

let backend = vercelBackend;

function apiStore() {
  let ver = null, timer = null, cbs = null;

    clearTimeout(timer);

    if (cbs && !document.hidden) timer = setTimeout(tick, 15000);

  document.addEventListener("visibilitychange", () => { if (!document.hidden && cbs) tick(); });
  return {
    subscribe(ok, err) { cbs = {ok, err}; tick(); },
    refresh() { if (cbs) tick(); },
    stop() { clearTimeout(timer); cbs = null; },
    async put(p) { const body = clone(p); delete body.id; await backend.put(p.id, body); },
    async remove(id) { await backend.remove(id); }
  };
}

function showGate(msg) {

function applySnapshot(list, removed, meta) {
  const ids = new Set(list.map(p => p.id));
  for (const p of list) {
    if (writing[p.id] || dirty[p.id]) continue;
    projects.set(p.id, p);
  }
  for (const id of [...projects.keys()]) if (!ids.has(id) && !writing[id] && !dirty[id]) projects.delete(id);
  loaded = true;
  renderAll({fromRemote: true, pending: meta && meta.hasPendingWrites});
}

async function persist(id) {
  if (!canWrite) return;
  if (writing[id]) { dirty[id] = true; return; }
  writing[id] = true;
  setSync("saving");
  try {
    do {
      dirty[id] = false;
      const p = projects.get(id);
      if (p) { p.updatedAt = new Date().toISOString(); p.updatedBy = meId; await store.put(p); }
    } while (dirty[id]);
    setSync(mode === "local" ? "local" : "ok");
  } catch (e) {
    handleWriteErr(e);
  } finally { writing[id] = false; }
}

function handleWriteErr(e) {
  const code = e && e.code;
  if (code === "unauthenticated" && mode === "api") {
    setSync("err"); showGate("Сессия закончилась. Войдите снова — несохранённое изменение повторите после входа.");
  } else if (code === "invalid_argument" && canWrite && (mode === "db" || mode === "api")) {
    canWrite = false; setSync("ro"); toast("У вас доступ только для просмотра — изменения не сохраняются.");
    renderAll();
  } else if (code === "quota_exceeded") {
    setSync("err"); toast("Хранилище заполнено: удалите старые проекты, чтобы сохранять новые.");
  } else {
    setSync("err"); toast("Не удалось сохранить. Проверьте соединение и повторите действие.");
  }
}

function hist(p, text) {
  p.history = p.history || [];

}

/* ---------- расчёты ---------- */
const isClosed = p => p.stage === "closed" || ["done","stopped","rejected"].includes(p.status);
function progress(p) {
  const a = p.activities || [];
  if (!a.length) return null;
  return Math.round(100 * a.filter(x => x.status === "done").length / a.length);
}
function lastMonitoring(p) {
  const m = (p.monitoring || []).map(x => x.date).filter(Boolean).sort();
  return m.length ? m[m.length-1] : null;
}
function health(p) {
  const t = today(), r = [];
  if (isClosed(p)) return {lvl: "idle", r};
  let lvl = "ok";
  const bump = l => { if (l === "bad" || (l === "warn" && lvl === "ok")) lvl = l; };
  const acts = (p.activities || []).filter(a => a.status !== "done" && a.end);
  const over = acts.filter(a => a.end < t);
  if (over.length) { bump("bad"); r.push(`${over.length} ${plural(over.length,"мероприятие просрочено","мероприятия просрочены","мероприятий просрочено")}`); }
  if (p.end && p.end < t && p.status === "active") { bump("bad"); r.push("истёк срок проекта"); }
  const soon = acts.filter(a => a.end >= t && days(t, a.end) <= 7);
  if (soon.length) { bump("warn"); r.push(`${soon.length} ${plural(soon.length,"срок","срока","сроков")} в ближайшие 7 дней`); }
  if (MON_STAGES.includes(p.stage) && p.status === "active") {
    const last = lastMonitoring(p) || p.stageSince;
    if (last && days(last, t) > 14) { bump("warn"); r.push(`нет мониторинга ${daysTxt(days(last, t))}`); }
  }
  if (p.type === "op" && p.approvedDate && !p.riskSubmitted && workdays(p.approvedDate, t) > 10) { bump("warn"); r.push("реестр рисков не передан в СРМ"); }
  const hi = (p.risks || []).filter(x => (x.prob||0)*(x.impact||0) >= 15);
  if (hi.length) { bump("warn"); r.push(`${hi.length} ${plural(hi.length,"риск","риска","рисков")} высокого уровня`); }
  return {lvl, r};
}
const scoreCls = s => s >= 15 ? "bad" : s >= 8 ? "warn" : "ok";

/* ---------- фильтры ---------- */
function filtered(ignoreType) {
  const q = S.q.trim().toLowerCase();
  return [...projects.values()].filter(p => {
    if (!ignoreType && S.type !== "all" && p.type !== S.type) return false;
    if (S.manager && p.manager !== S.manager) return false;
    if (S.owner && p.owner !== S.owner) return false;
    if (S.half && p.half !== S.half) return false;
    if (S.prio && p.priority !== S.prio) return false;
    if (q) {
      const hay = [p.name, p.owner, p.manager, p.initiator, p.team, ...(p.activities||[]).map(a => a.name + " " + (a.responsible||""))].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => (a.end || "9999").localeCompare(b.end || "9999"));
}

function halfOptions() {
  const y = new Date().getFullYear();
  const set = new Set([`${y-1}-1`,`${y-1}-2`,`${y}-1`,`${y}-2`,`${y+1}-1`,`${y+1}-2`]);

/* ---------- контроль сроков ---------- */
function controlData() {
  const t = today(), out = {over: [], soon: [], mon: [], rr: [], expired: [], risks: []};
  for (const p of projects.values()) {
    if (isClosed(p)) continue;
    for (const a of p.activities || []) {
      if (a.status === "done" || !a.end) continue;
      if (a.end < t) out.over.push({p, a, d: days(a.end, t)});
      else if (days(t, a.end) <= 7) out.soon.push({p, a, d: days(t, a.end)});
    }
    if (MON_STAGES.includes(p.stage) && p.status === "active") {
      const last = lastMonitoring(p) || p.stageSince;
      if (last && days(last, t) > 14) out.mon.push({p, last, d: days(last, t)});
    }
    if (p.type === "op" && p.approvedDate && !p.riskSubmitted) {
      const w = workdays(p.approvedDate, t);
      if (w > 10) out.rr.push({p, w});
    }
    if (p.end && p.end < t && p.status === "active") out.expired.push({p, d: days(p.end, t)});
    for (const r of p.risks || []) { const s = (r.prob||0)*(r.impact||0); if (s >= 15) out.risks.push({p, r, s}); }
  }
  out.over.sort((a, b) => b.d - a.d); out.soon.sort((a, b) => a.d - b.d); out.mon.sort((a, b) => b.d - a.d);
  out.risks.sort((a, b) => b.s - a.s);
  return out;
}

/* ---------- отчёты ---------- */
function quarterOptions() {
  const d = new Date(), y = d.getFullYear(), q = Math.floor(d.getMonth()/3) + 1, out = [];
  for (let i = -4; i <= 1; i++) { let qq = q + i, yy = y; while (qq < 1) { qq += 4; yy--; } while (qq > 4) { qq -= 4; yy++; } out.push(`${yy}-Q${qq}`); }
  return out;
}
const qLabel = s => { const [y, q] = s.split("-Q"); return `${["I","II","III","IV"][q-1]} квартал ${y}`; };
const qRange = s => { const [y, q] = s.split("-Q").map(Number); const m = (q-1)*3; return [iso(new Date(y, m, 1)), iso(new Date(y, m+3, 0))]; };

function reportData() {
  const t = S.rep;
  if (t === "plan5") {
    const list = [...projects.values()].filter(p => p.half === S.repHalf && p.status !== "rejected").sort((a,b) => (a.name||"").localeCompare(b.name||"", "ru"));

    const rows = [];
    list.forEach((p, i) => {
      rows.push({proj: true, c: [`${i+1}.`, p.name, fmt(p.end), p.owner || "", p.type === "op" ? "операционный" : "инициативный (целевой)", p.completionForm || "", changeNotes(p)]});
      (p.activities||[]).forEach((a, j) => rows.push({c: [`${i+1}.${j+1}`, a.name, fmt(a.end), a.responsible || "", "", a.form || "", a.note || ""]}));
    });
    return {app: "Приложение 5 к Регламенту управления проектами", title: `План проектной деятельности АО «Государственный фонд социального страхования» на ${halfLabel(S.repHalf).replace("пол.", "полугодие")} г.`, head, rows, file: `План проектной деятельности ${halfLabel(S.repHalf)}.xlsx`};
  }
  if (t === "report7") {

async function downloadReport(r = reportData()) {
  if (!window.XLSX) { toast("Модуль Excel ещё загружается, повторите через пару секунд."); return; }
  const aoa = [[r.app], [r.title], [], r.head, ...r.rows.map(x => x.c)];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = r.head.map((h, i) => ({wch: i === 0 ? 7 : i === 1 ? 48 : h.length <= 6 ? 6 : h.length > 40 ? 50 : 22}));
  ws["!merges"] = [{s:{r:0,c:0},e:{r:0,c:r.head.length-1}},{s:{r:1,c:0},e:{r:1,c:r.head.length-1}}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Отчёт");
  const buf = XLSX.write(wb, {type: "array", bookType: "xlsx"});
  try { await dl.save({filename: r.file.replace(/[\\/:*?"<>|]/g, " "), data: new Uint8Array(buf)}); toast("Файл сохранён"); }
  catch (e) { if (e && e.code === "declined") return; toast(e && e.code === "host_unavailable" ? "Это приложение не умеет сохранять файлы — откройте страницу в браузере." : "Не удалось сохранить файл."); }
}

async function copyReport(r = reportData()) {
  const tsv = [r.head, ...r.rows.map(x => x.c)].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join("\t")).join("\n");
  try { await navigator.clipboard.writeText(tsv); toast("Таблица скопирована — вставьте в Excel или Word"); }

  return ds.length ? [ds[0], ds[ds.length - 1]] : null;

function rmRange(list) {
  const d = new Date(), y = d.getFullYear(), v = S.rmRange;
  const twelve = () => [iso(new Date(y, d.getMonth() - 2, 1)), iso(new Date(y, d.getMonth() + 10, 0))];
  if (v === "12m") return twelve();
  if (v.startsWith("y:")) { const yy = v.slice(2); return [`${yy}-01-01`, `${yy}-12-31`]; }
  if (v.startsWith("h:")) { const [yy, h] = v.slice(2).split("-"); return h === "1" ? [`${yy}-01-01`, `${yy}-06-30`] : [`${yy}-07-01`, `${yy}-12-31`]; }
  const sp = list.map(pSpan).filter(Boolean);
  if (!sp.length) return twelve();
  const mn = sp.map(s => s[0]).sort()[0], mx = sp.map(s => s[1]).sort().pop();
  const a = parse(mn), b = parse(mx);
  let from = new Date(a.getFullYear(), a.getMonth(), 1), to = new Date(b.getFullYear(), b.getMonth() + 1, 0);
  const months = (to.getFullYear() - from.getFullYear()) * 12 + to.getMonth() - from.getMonth() + 1;
  if (months < 6) to = new Date(from.getFullYear(), from.getMonth() + 6, 0);
  return [iso(from), iso(to)];
}
function monthsIn(from, to) {
  const out = []; const a = parse(from), e = parse(to);
  for (let d = new Date(a.getFullYear(), a.getMonth(), 1); d <= e; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const m = d.getMonth();
    out.push({from: iso(d), to: iso(new Date(d.getFullYear(), m + 1, 0)), label: `${MON[m]} ${String(d.getFullYear()).slice(2)}`, jan: m === 0});
  }

}
function rmRegDates(from, to) {

    out.push({d: `${y}-01-20`, t: "Утверждение Плана проектной деятельности на I полугодие (п. 9.4)"});

        ${st.map((s, i) => `<button type="button" class="st ${i < ci ? "done" : i === ci ? "cur" : ""}" data-stage="${s.k}" title="${esc(s.h)}" ${canWrite ? "" : "disabled"}>${esc(s.t)}</button>`).join("")}
      </div>
      <div class="dtabs" role="tablist">${tabs.map(([k, t]) => `<button class="tab" role="tab" type="button" data-dtab-btn="${k}" aria-selected="${k === S.dtab}">${esc(t)}</button>`).join("")}</div>

      <fieldset id="dfs" ${canWrite ? "" : "disabled"}>${drawerTab(p)}</fieldset>

  </aside>`;

}

async function fillNames(root) {
  const els = $$("[data-uid]", root);
  if (!els.length) return;
  if (!userApi) { els.forEach(e => e.textContent = "участник"); return; }
  const ids = [...new Set(els.map(e => e.dataset.uid))];
  const ps = await userApi.profiles(ids);
  els.forEach(e => { const p = ps[e.dataset.uid]; e.textContent = (p && p.isMe) ? "вы" : ((p && p.name) || "участник"); });
}

/* ---------- изменения ---------- */
function newProject() {
  if (!canWrite) return;
  const type = S.type === "init" ? "init" : "op", t = today();
  const p = {id: uid(), name: "Новая инициатива", type, form: "Проект", stage: STAGES[type][0].k, stageSince: t, status: "active", priority: "mid",
    owner: "", initiator: "", manager: "", team: "", half: halfOf(addDays(t, 40)), start: t, end: "", approvedDate: "", completionForm: "",
    goal: "", expected: "", resources: "", evaluation: "", notes: "", statusReason: "", riskSubmitted: false, riskSubmittedDate: "",
    activities: [], risks: [], monitoring: [], decisions: [], links: [], history: [], createdAt: new Date().toISOString(), createdBy: meId};
  hist(p, "Проект создан");
  projects.set(p.id, p); persist(p.id);
  if (S.tab !== "board") setTab("board"); else renderAll();
  openProject(p.id, "passport");
  setTimeout(() => { const n = $("#p-name"); if (n) { n.focus(); n.select(); } }, 30);
}

function setStage(p, k) {
  if (p.stage === k) return;
  const from = stageLabel(p);
  p.stage = k; p.stageSince = today();
  hist(p, `Этап: «${from}» → «${stageLabel(p)}»`);
  if (k === "closed" && p.status === "active") { p.status = "done"; hist(p, "Статус: «Завершён»"); }
  persist(p.id); renderAll(); if (S.openId === p.id) renderDrawer();
}

function onDrawerChange(e) {
  const el = e.target, p = projects.get(S.openId);
  if (!p || !canWrite || !el.dataset.f) return;
  const f = el.dataset.f;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.num) v = Number(v);
  let rerender = false;
  if (el.dataset.coll) {
    const item = (p[el.dataset.coll] || []).find(x => x.id === el.dataset.id);
    if (!item || item[f] === v) return;
    if (el.dataset.coll === "activities" && f === "status") { hist(p, `Мероприятие «${item.name || "без названия"}»: ${ACT_ST[item.status] || "—"} → ${ACT_ST[v]}`); }
    if (el.dataset.coll === "activities" && f === "end" && item.end) { hist(p, `Срок мероприятия «${item.name || "без названия"}»: ${fmt(item.end)} → ${fmt(v)}`); }
    item[f] = v;
    if (el.dataset.coll === "risks" && (f === "prob" || f === "impact")) {
      const s = (item.prob||0)*(item.impact||0), sc = document.getElementById("score-" + item.id);
      if (sc) { sc.textContent = s; sc.className = `score chip ${scoreCls(s)}`; }
    }
    if (el.dataset.coll === "activities" && (f === "status" || f === "end")) {
      const tr = el.closest("tr"); if (tr) tr.classList.toggle("overdue", item.status !== "done" && item.end && item.end < today());
    }
  } else {
    if (p[f] === v) return;
    if (f === "type") {
      hist(p, `Вид: ${TYPE[p.type]} → ${TYPE[v]}`);
      p.type = v;
      if (!STAGES[v].some(s => s.k === p.stage)) { p.stage = STAGES[v][0].k; p.stageSince = today(); }
      rerender = true;
    } else if (f === "status") {
      hist(p, `Статус: «${STATUS[p.status]}» → «${STATUS[v]}»`); p.status = v; rerender = true;
    } else if (f === "end") {
      hist(p, `Срок проекта: ${fmt(p.end)} → ${fmt(v)}`); p.end = v;
    } else if (f === "riskSubmitted") {
      p.riskSubmitted = v; if (v && !p.riskSubmittedDate) p.riskSubmittedDate = today();
      hist(p, v ? "Реестр рисков передан в СРМ" : "Отметка о передаче реестра рисков снята"); rerender = true;
    } else {
      p[f] = v;
      if (f === "half") renderFilters();
    }
  }
  persist(p.id);
  renderView(); renderSummary();
  if (rerender) renderDrawer();
}

function addItem(coll) {
  const p = projects.get(S.openId); if (!p || !canWrite) return;
  p[coll] = p[coll] || [];
  if (coll === "activities") p.activities.push({id: uid(), name: "", start: "", end: "", responsible: "", form: "", status: "todo", note: ""});
  if (coll === "risks") p.risks.push({id: uid(), code: `R-${pad(p.risks.length + 1)}`, desc: "", category: RISK_CAT[1], prob: 3, impact: 3, response: "", owner: "", comment: "", toFund: false});
  persist(p.id); renderDrawer(); renderView(); renderSummary();
  const rows = $$(".etbl tbody tr"); const last = rows[rows.length - 1];
  const first = last && $("textarea, input", last); if (first) first.focus();
}

function delItem(coll, id) {
  const p = projects.get(S.openId); if (!p || !canWrite) return;
  const it = (p[coll] || []).find(x => x.id === id);
  p[coll] = (p[coll] || []).filter(x => x.id !== id);
  if (coll === "activities" && it && it.name) hist(p, `Мероприятие удалено: «${it.name}»`);
  persist(p.id); renderDrawer(); renderView(); renderSummary();
}

function addFromForm(kind) {
  const p = projects.get(S.openId); if (!p || !canWrite) return;
  if (kind === "mon") {
    const text = $("#m-text").value.trim(), actions = $("#m-actions").value.trim();
    if (!text && !actions) { toast("Опишите результат мониторинга"); return; }
    p.monitoring = p.monitoring || [];
    p.monitoring.push({id: uid(), date: $("#m-date").value || today(), state: $("#m-state").value, text, actions, by: meId});
    hist(p, `Запись мониторинга от ${fmt($("#m-date").value)}`);
  }
  if (kind === "dec") {
    const k = $("#d-kind").value;
    p.decisions = p.decisions || [];
    p.decisions.push({id: uid(), date: $("#d-date").value || today(), body: $("#d-body").value, protocol: $("#d-proto").value.trim(), kind: k, text: $("#d-text").value.trim()});
    hist(p, `Решение: ${$("#d-body").value} — ${DEC_KIND[k]}`);
    const map = {rework: "rework", pause: "paused", stop: "stopped", reject: "rejected"};
    if (map[k] && p.status !== map[k]) { p.status = map[k]; hist(p, `Статус: «${STATUS[map[k]]}»`); }
    if ((k === "approve") && p.status !== "active" && !isClosed(p)) { p.status = "active"; }
    if (k === "approve" && p.type === "op" && !p.approvedDate && ["init","plan"].includes(p.stage)) p.approvedDate = $("#d-date").value;
  }
  if (kind === "link") {
    const url = $("#l-url").value.trim(), title = $("#l-title").value.trim();
    if (!url && !title) { toast("Укажите название или ссылку"); return; }
    p.links = p.links || [];
    p.links.push({id: uid(), kind: $("#l-kind").value, title, url});
  }
  persist(p.id); renderDrawer(); renderView(); renderSummary();
}

async function deleteProject() {
  const id = S.openId, p = projects.get(id); if (!p) return;
  closeDrawer();
  projects.delete(id); renderAll();
  try { await store.remove(id); toast("Проект удалён"); } catch (e) { handleWriteErr(e); }
}

function loadExamples() {
  if (!canWrite) return;
  const t = today(), d = n => addDays(t, n);
  const mk = o => Object.assign({id: uid(), form: "Проект", status: "active", priority: "mid", initiator: "", team: "", goal: "", expected: "", resources: "", evaluation: "", notes: "", statusReason: "", riskSubmitted: false, riskSubmittedDate: "", completionForm: "", approvedDate: "", activities: [], risks: [], monitoring: [], decisions: [], links: [], history: [{at: new Date().toISOString(), by: meId, text: "Пример создан"}], createdAt: new Date().toISOString(), createdBy: meId}, o);
  const a = (name, s, e, resp, form, st) => ({id: uid(), name, start: d(s), end: d(e), responsible: resp, form, status: st, note: ""});
  const list = [
    mk({name: "Пример: Оптимизация процесса назначения выплат в филиалах", type: "op", stage: "impl", stageSince: d(-60), priority: "high", half: halfOf(d(-60)),
      owner: "Департамент социальных выплат", initiator: "Филиал по г. Алматы", manager: "Менеджер ПО (пример)", team: "Главный специалист ДСВ\nГлавный специалист ДИТ\nПредставитель филиала",
      start: d(-60), end: d(45), approvedDate: d(-60), riskSubmitted: true, riskSubmittedDate: d(-50), completionForm: "Изменения в ВНД, отчёт о завершении",
      goal: "Сократить срок назначения выплат за счёт исключения дублирующих проверок.", expected: "Срок назначения −20%, снижение нагрузки на специалистов филиалов.",
      activities: [a("Анализ текущего процесса и узких мест", -60, -35, "ДСВ", "Аналитическая записка", "done"), a("Разработка целевой модели процесса", -34, -5, "ДСВ, ПО", "Схема процесса", "doing"), a("Пилот в двух филиалах", -2, 25, "Филиалы, ДИТ", "Отчёт о пилоте", "doing"), a("Внесение изменений в ВНД", 20, 40, "ДСВ, юр. служба", "Проект ВНД", "todo")],
      risks: [{id: uid(), code: "R-01", desc: "Задержка доработки ИС под новую модель", category: "ИТ и информационная безопасность", prob: 4, impact: 4, response: "Согласовать приоритет с ДИТ, резервный ручной режим на пилоте", owner: "ДИТ", comment: "", toFund: true}, {id: uid(), code: "R-02", desc: "Нехватка специалистов в пилотных филиалах", category: "Ресурсный (кадры, сроки)", prob: 2, impact: 3, response: "Временное перераспределение нагрузки", owner: "Филиалы", comment: "", toFund: false}],
      monitoring: [{id: uid(), date: d(-20), state: "attention", text: "Целевая модель в работе, отставание около недели из-за согласования с ДИТ.", actions: "Доложено руководителю Офиса, назначена рабочая встреча с ДИТ.", by: meId}],
      decisions: [{id: uid(), date: d(-60), body: "Правление Фонда", protocol: "Протокол № (пример)", kind: "approve", text: "Инициатива включена в План проектной деятельности."}]}),
    mk({name: "Пример: Аналитическая справка по охвату ОСС для МТСЗН", type: "init", stage: "plan", stageSince: d(-6), half: halfOf(t),
      owner: "Актуарно-аналитический центр", initiator: "МТСЗН (письмо)", manager: "Менеджер ПО (пример)", start: d(-10), end: d(70), approvedDate: d(-10), completionForm: "Аналитическая справка, презентация",
      goal: "Подготовить справку по охвату обязательным социальным страхованием по запросу МТСЗН.",
      activities: [a("Согласование ТЗ и структуры справки", -6, 6, "ПО, ААЦ", "Утверждённое ТЗ", "doing"), a("Сбор и обработка данных", 7, 40, "ААЦ", "Свод данных", "todo"), a("Подготовка справки и презентации", 41, 65, "ПО", "Справка", "todo")]}),
    mk({name: "Пример: Электронный архив проектной документации", type: "op", stage: "pre", stageSince: d(-3), priority: "low", half: halfOf(d(60)),
      owner: "Административный департамент", initiator: "Проектный офис", manager: "", start: d(-3), end: d(150), completionForm: "Регламент хранения, настроенный раздел на сетевом сервере",
      goal: "Единое хранение проектной документации на сетевом сервере (п. 28 Регламента)."})
  ];
  list.forEach(p => { projects.set(p.id, p); persist(p.id); });
  renderAll(); toast("Примеры добавлены — их можно удалить из карточки проекта");
}

/* ---------- общий рендер ---------- */
function renderView() {
  if (S.tab === "board") renderBoard();
  else if (S.tab === "registry") renderRegistry();
  else if (S.tab === "roadmap") renderRoadmap();
  else if (S.tab === "control") renderControl();
  else renderReports();
}
function renderAll(opt = {}) {
  renderFilters(); renderSummary(); renderView();
  $("#newBtn").hidden = !canWrite;
  if (S.openId) {
    const inside = document.activeElement && document.activeElement.closest && document.activeElement.closest(".drawer");
    if (opt.fromRemote && (inside || opt.pending)) drawerStale = true;
    else if (opt.fromRemote || !$(".drawer")) renderDrawer();
  }
}
function setTab(t) {
  if (t === "roadmap" && S.tab !== "roadmap") S.type = "all";
  S.tab = t;
  $$("#tabs .tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t);
  renderAll();
}
let toastTimer;
function toast(msg) {
  const r = $("#toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => r.innerHTML = "", 3200);
}

/* ---------- события ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-open], .scrim");
  if (!t) return;
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.type) { S.type = t.dataset.type; return renderAll(); }
  if (t.dataset.open) return openProject(t.dataset.open, t.dataset.dtab);
  if (t.dataset.dtabBtn) { S.dtab = t.dataset.dtabBtn; S.confirmDel = false; const b = $(".d-body"); renderDrawer(); if (b) $(".d-body").scrollTop = 0; return; }
  if (t.dataset.stage) { const p = projects.get(S.openId); if (p && canWrite) setStage(p, t.dataset.stage); return; }
  if (t.dataset.add) return addItem(t.dataset.add);
  if (t.dataset.delColl) return delItem(t.dataset.delColl, t.dataset.id);
  if (t.dataset.copy !== undefined) { navigator.clipboard.writeText(t.dataset.copy).then(() => toast("Путь скопирован"), () => toast("Выделите путь и нажмите Ctrl+C")); return; }
  const act = t.dataset.act;
  if (act === "close") return closeDrawer();
  if (act === "new") return newProject();
  if (act === "examples") return loadExamples();
  if (act === "del") { S.confirmDel = true; return renderDrawer(); }
  if (act === "delNo") { S.confirmDel = false; return renderDrawer(); }
  if (act === "delYes") return deleteProject();
  if (act === "addMon") return addFromForm("mon");
  if (act === "addDec") return addFromForm("dec");
  if (act === "addLink") return addFromForm("link");
  if (t.id === "newBtn") return newProject();
  if (t.id === "xlsxRep") return downloadReport();
  if (t.id === "copyRep") return copyReport();
  if (t.id === "xlsxRm") return downloadReport(roadmapTable());
  if (t.id === "copyRm") return copyReport(roadmapTable());
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.closest(".drawer")) return onDrawerChange(e);
  if (el.id === "fManager") S.manager = el.value;
  else if (el.id === "fOwner") S.owner = el.value;
  else if (el.id === "fHalf") S.half = el.value;
  else if (el.id === "fPrio") S.prio = el.value;
  else if (el.id === "repType") S.rep = el.value;
  else if (el.id === "repHalf") S.repHalf = el.value;
  else if (el.id === "repQ") S.repQ = el.value;
  else if (el.id === "repProj") S.repProj = el.value;
  else if (el.id === "rmRange") S.rmRange = el.value;
  else if (el.id === "rmGroup") S.rmGroup = el.value;
  else if (el.id === "rmActs") S.rmActs = el.checked;
  else return;
  renderAll();
});
$("#fSearch").addEventListener("input", e => { S.q = e.target.value; renderView(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.openId) closeDrawer(); });
document.addEventListener("focusout", e => {
  if (!drawerStale || !S.openId) return;
  setTimeout(() => { const a = document.activeElement; if (drawerStale && !(a && a.closest && a.closest(".drawer"))) renderDrawer(); }, 0);
});
/* drag & drop по этапам */
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-drag]"); if (c && canWrite) e.dataTransfer.setData("text/plain", c.dataset.drag); });
document.addEventListener("dragover", e => { const c = e.target.closest && e.target.closest("[data-col]"); if (c && canWrite) { e.preventDefault(); $$(".col.drop").forEach(x => x !== c && x.classList.remove("drop")); c.classList.add("drop"); } });
document.addEventListener("dragleave", e => { const c = e.target.closest && e.target.closest("[data-col]"); if (c && !c.contains(e.relatedTarget)) c.classList.remove("drop"); });
document.addEventListener("drop", e => {
  const c = e.target.closest && e.target.closest("[data-col]"); if (!c) return;
  e.preventDefault(); c.classList.remove("drop");
  const p = projects.get(e.dataTransfer.getData("text/plain"));
  if (p) setStage(p, c.dataset.col);
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== S.tab) setTab(h); });
let rzT; window.addEventListener("resize", () => { if (S.tab !== "roadmap") return; clearTimeout(rzT); rzT = setTimeout(renderView, 200); });

/* ---------- запуск ---------- */
(async function boot() {
  const h = location.hash.slice(1);
  if (TABS.includes(h)) { S.tab = h; S.type = h === "roadmap" ? "all" : "op"; $$("#tabs .tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === h))); }
  renderAll();
  // Вне claude.ai (например, на Vercel): свой сервер /api со входом по коду.
  if (!window.claude && /^https?:$/.test(location.protocol)) {
    dl = browserDl;
    if (NEON.api) backend = neonBackend(NEON);
    try {
      const me = await backend.me();
      startApi(me); return;
    } catch (e) {
      if (e.code === "unauthenticated") { showGate(); return; }
      if (NEON.api) { showGate("Нет связи с сервером. Проверьте интернет и войдите снова."); return; }
      if (e.status === 500) { showGate("Сервер ещё не настроен: нет кодов доступа или хранилища."); return; }
      // /api нет (обычный статический сервер) — работаем локально
    }
  }
  const [db, u, d] = await Promise.all([use("db"), use("user"), use("downloads")]);
  userApi = u; dl = d || (db ? null : browserDl);
  if (u) { try { meId = await u.id(); } catch (e) {} }
  if (db) {
    mode = "db"; store = dbStore(db);
    if (u) { const w = await u.can("data.write"); if (w === false) canWrite = false; }
    setSync(canWrite ? "wait" : "ro");
    const timer = setTimeout(() => { if (!loaded) setSync("err", "Нет связи с хранилищем"); }, 10000);
    store.subscribe((list, removed, meta) => {
      if (!meta || !meta.fromCache) { clearTimeout(timer); if (canWrite) setSync("ok", "Синхронизировано"); }
      applySnapshot(list, removed, meta);
    }, err => { clearTimeout(timer); setSync("err", "Хранилище недоступно"); loaded = true; renderAll(); });
  } else {
    mode = "local"; store = localStore(); setSync("local");
    store.subscribe(list => applySnapshot(list, []));
  }
})();
})();
</script>
